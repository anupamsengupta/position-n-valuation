services:
  posval-postgres:
    image: postgres:16-alpine
    container_name: posval-postgres
    ports:
      - "9432:5432"
    environment:
      POSTGRES_DB: posval
      POSTGRES_USER: posval
      POSTGRES_PASSWORD: posval
    volumes:
      - ./src/main/resources/db/init-schemas.sql:/docker-entrypoint-initdb.d/01-init.sql
      - posval-postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posval"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-local:
    image: redis:8-alpine
    container_name: redis-local
    ports:
      - "6379:6379"
    command: >
      redis-server
      --bind 0.0.0.0
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
      --databases 1
      --save ""
      --appendonly no
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redisinsight:
    image: redis/redisinsight:3.8.0
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    networks:
      - app-network
    depends_on:
      redis-local:
        condition: service_healthy

  kafka:
    image: confluentinc/cp-kafka:7.9.6
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - app-network

  conduktor-postgres:
    image: postgres:16-alpine
    container_name: conduktor-postgres
    ports:
      - "9435:5432"
    environment:
      POSTGRES_USER: conduktor
      POSTGRES_PASSWORD: conduktor
      POSTGRES_DB: conduktor
    volumes:
      - conduktor-postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  conduktor:
    image: conduktor/conduktor-console:1.46.2
    container_name: conduktor
    ports:
      - "8081:8080"
    depends_on:
      - kafka
      - conduktor-postgres
    environment:
      CDK_DATABASE_URL: "postgresql://conduktor:conduktor@conduktor-postgres:5432/conduktor"
      CDK_ORGANIZATION_NAME: local
      CDK_ADMIN_EMAIL: admin@local.com
      CDK_ADMIN_PASSWORD: Admin123!
      CDK_CLUSTERS_0_ID: local
      CDK_CLUSTERS_0_NAME: local
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    volumes:
      - conduktor-data:/var/conduktor
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  posval-postgres-data:
  redis-data:
  redisinsight-data:
  kafka-data:
  conduktor-postgres-data:
  conduktor-data:
