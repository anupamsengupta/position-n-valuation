server:
  port: 8080

pv:
  datasource:
    url: jdbc:postgresql://localhost:9432/posval
    username: posval
    password: posval
    pool-size: 10
  kafka:
    bootstrap-servers: localhost:9092
  redis:
    host: localhost
    port: 6379
  outbox:
    relay-interval-ms: 500
  seed:
    enabled: true
  cache:
    warmup:
      enabled: true
      lookback-days: 120
      pool-size: 4
