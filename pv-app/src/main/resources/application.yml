server:
  port: 8080

pv:
  pricing:
    strategy: rule-engine  # "expression" or "rule-engine"
  datasource:
    url: jdbc:postgresql://localhost:9432/posval
    username: posval
    password: posval
    pool-size: 10
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      max-poll-records: 50
      concurrency: 16
  redis:
    host: localhost
    port: 6379
    password: ""              # set for production (must match Redis requirepass)
    timeout-seconds: 5
  outbox:
    relay-interval-ms: 500
  seed:
    enabled: true
  da:
    poller:
      enabled: false              # set to true to activate the auction folder poller (S9.4, D-14)
      inbox-directory: ./da-import/inbox
      processed-directory: ./da-import/processed
      failed-directory: ./da-import/failed
      interval-ms: 60000          # fixed-delay in milliseconds between polls (default: 60s)
      file-pattern: "*.csv"       # glob pattern for auction result files
  cache:
    l1:
      max-size: 2000000
      ttl-hours: 24
    ttl:
      market-data-stable-hours: 24    # fixings, FX rates, indexes, spreads
      market-data-volatile-hours: 1   # forward curves, vol surfaces
      volume-hours: 24                # volume interval cache
      forward-mark-minutes: 120         # ephemeral forward marks
    scan-batch-size: 1000             # SCAN COUNT per invalidation iteration
    warmup:
      enabled: true
      lookback-days: 120
      pool-size: 4
